# Which Python environment runs each engine's benchmark worker (benchmarks/bench/protocol.py reads this file).
#
# [env.<name>]     python      interpreter candidates, the first existing one wins; placeholders:
#                              {driver}  the interpreter running the driver (python -m benchmarks.bench)
#                              {prefix}  $DK_BENCH_ENV_PREFIX, default runs/bench/envs (benchmarks/envs/setup.sh)
#                              {repo}    the checkout;  {env:VAR}  an environment variable (candidate skipped if unset)
#                              $DK_BENCH_PY_<NAME> (upper case, '-' as '_') is always tried first
#                  pythonpath  extra PYTHONPATH entries (relative to the checkout unless absolute); the worker always
#                              gets the checkout itself, never the driver's PYTHONPATH
#                  vars        environment variables for the worker
# [engine.<id>]    env         the environment; pythonpath / vars are added to the environment's
#
# Any other *.toml in this directory (in name order: the entries of additional adapters) and then a local, untracked
# override file ($DK_BENCH_ENVS, default runs/bench/envs.local.toml: other interpreters, other source trees) are
# deep-merged over this file. No machine-specific paths here.

[env.self]
python = ["{driver}"]

# the NablaEngine environment (scripts/setup_env.sh): nablaengine, mujoco 3.17.0, mujoco-mjx 3.17.0, JAX,
# warp-lang 1.18.0; runs dk, dk_iface, dk_jac, mjx and mjc
[env.dk]
python = ["{env:DK_ENV}/venv/bin/python", "{prefix}/dk/venv/bin/python", "{driver}"]
pythonpath = ["src"]

# PyPI mujoco-warp 3.17.0 + mujoco 3.17.0 + warp-lang 1.18.0 (requirements-mjw-native.txt)
[env.mjw-native]
python = ["{prefix}/mjw-native/venv/bin/python"]
vars = { JAX_PLATFORMS = "cpu" }

# mujoco 3.17.0 + warp-lang 1.18.0 and no installed mujoco_warp: each engine puts its source tree on PYTHONPATH
[env.mjw-pr]
python = ["{prefix}/mjw-pr/venv/bin/python"]
vars = { JAX_PLATFORMS = "cpu" }

# PyTorch 2.14.1 + genesis-world 1.4.5 + quadrants 1.3.3 + mujoco 3.17.0 (requirements-genesis.txt); Genesis's and
# quadrants' kernel caches go to their default places (~/.cache/genesis, ~/.cache/quadrants) unless XDG_CACHE_HOME is set
[env.genesis]
python = ["{prefix}/genesis/venv/bin/python"]

[engine.null]
env = "self"

[engine.dk]
env = "dk"

[engine.dk_iface]
env = "dk"

[engine.dk_jac]
env = "dk"

[engine.mjx]
env = "dk"

[engine.mjc]
env = "dk"
vars = { JAX_PLATFORMS = "cpu" }

[engine.mjw]
env = "mjw-native"

# etaoxing/mujoco_warp @ 357a75d, as published (the head of the open upstream PR google-deepmind/mujoco_warp#1535)
[engine.mjw_pr1535]
env = "mjw-pr"
pythonpath = ["{prefix}/mjw-pr/src/pr1535"]

# 357a75d + etaoxing/mujoco_warp#1 (4af093f)
[engine.mjw_pr1535_fix]
env = "mjw-pr"
pythonpath = ["{prefix}/mjw-pr/src/pr1535_fix"]

# Genesis 1.4.5 (PyPI), its rigid solver (benchmarks/bench/adapters/genesis.py)
[engine.genesis]
env = "genesis"
